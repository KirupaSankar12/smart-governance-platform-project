server.port=8083
spring.application.name=grievance-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://localhost:5432/civicpulse_db
spring.datasource.username=postgres
spring.datasource.password=civic@12

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/civicpulse

# ─── Kafka Producer ─────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.retries=1

# ─── AI Duplicate Detection & Embedding Configuration ──────────────────────
gemini.api.key=${GEMINI_API_KEY:}
# gemini-embedding-001 is the current stable embedding model (replaces deprecated text-embedding-004)
# Produces 3072-dimensional vectors with strong semantic understanding
gemini.embedding.model=gemini-embedding-001
gemini.embedding.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-embedding-001:embedContent
grievance.duplicate.threshold.high=0.85
grievance.duplicate.threshold.medium=0.70